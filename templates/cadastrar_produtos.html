{% extends 'base.html' %}

{% block title %}Cadastrar Produtos — Moda Store{% endblock %}

{% block content %} 
<div class="container py-4">
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
    <h3 class="mb-4 text-dark text-center">Cadastro de Produto</h3>

    <form action="{{ url_for('cadastrar_produtos') }}" method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome do Produto</label>
          <input type="text" class="form-control" id="nome" name="nome" required>
        </div>
        <div class="col-md-6">
          <label for="preco" class="form-label">Preço</label>
          <input type="text" class="form-control" id="preco" name="preco" required>
        </div>
        <div class="col-md-6">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
        </div>
        <div class="col-md-6">
          <label for="quantidade" class="form-label">Quantidade</label>
          <input type="number" class="form-control" id="quantidade" name="quantidade" required>
        </div>
        <div class="col-md-6">
          <label for="categoria" class="form-label">Categoria</label>
          <select class="form-select" id="categoria" name="categoria">
            <option value="Roupas">Roupas</option>
            <option value="Calçados">Calçados</option>
            <option value="Acessórios">Acessórios</option>
          </select>
        </div>
      </div>

      <div class="d-grid gap-2 d-md-flex justify-md-content-end mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-secondary me-md-2">Cancelar</a>
        <button type="submit" class="btn btn-primary fw-bold">Salvar Cadastro</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
